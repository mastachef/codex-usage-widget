name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows build
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CodexUsageWidget-win-x64
          path: publish/CodexUsageWidget.exe

      - name: Publish framework-dependent Lite build
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish-lite
          $size = (Get-Item .\publish-lite\CodexUsageWidget.exe).Length
          Write-Host ("LITE_EXE_BYTES=" + $size)

      - name: Upload Lite build
        uses: actions/upload-artifact@v4
        with:
          name: CodexUsageWidget-win-x64-lite
          path: publish-lite/CodexUsageWidget.exe
